name: Apply X-pattern calculus2 mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_xpattern_calculus2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply mapping patch
        run: python scripts/add_xpattern_calculus2.py

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "feat: add X-pattern calculus2 2025 and 2024 mapping"
            git push origin main
          fi
