name: Revert commonmath2 exam type patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert_commonmath2_exam_type.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Revert app.py exam types
        run: python scripts/revert_commonmath2_exam_type.py

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "revert: restore commonmath2 mixed exam periods"
            git push origin main
          fi
