name: Apply commonmath2 exam type patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_commonmath2_exam_type_patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply app.py patch
        run: python scripts/patch_commonmath2_exam_type.py

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "fix: set commonmath2 X-pattern exams to 2학기중간"
            git push origin main
          fi
