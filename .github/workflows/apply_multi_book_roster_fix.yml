name: Apply multi-book roster matching fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_multi_book_roster_fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/fix_multi_book_roster_matching.py

      - name: Verify syntax
        run: python -m py_compile app.py

      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "fix: handle comma-separated roster books in teacher views"
            git push origin main
          fi
