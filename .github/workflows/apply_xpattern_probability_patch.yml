name: Apply X-Pattern probability config patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_xpattern_probability_patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.head_commit.message == 'chore: apply xpattern config patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply app.py patch
        run: python scripts/patch_xpattern_probability.py

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "fix: sync X-pattern probability school map with PDF"
            git push origin main
          fi
